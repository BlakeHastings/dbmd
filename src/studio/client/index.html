<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dbmd studio</title>
    <link rel="icon" href="data:," />
    <style>
      /*
        One palette, in one place, because a colour invented per component is a
        colour that is legible in one theme and not the other. ADR 0005 asks for
        this once notes and groups arrive; it is cheaper to start here.
      */
      :root {
        color-scheme: light dark;
        --page: #f6f6f4;
        --surface: #ffffff;
        --ink: #17181a;
        --muted: #6a6d73;
        --line: #d6d8dc;
        --accent: #2f6fd0;
        --edge: #8a8f98;
        --key: #b07d00;
        --bad: #b3261e;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page: #17181a;
          --surface: #212328;
          --ink: #e8e9ec;
          --muted: #9aa0a8;
          --line: #383b42;
          --accent: #74a7f5;
          --edge: #7c828c;
          --key: #e0b64a;
          --bad: #f2857c;
        }
      }

      /*
        The note and group palette, and the whole of it.

        ADR 0005 writes a colour as a name (`color: amber`), so the studio's job
        is to turn seven names into seven pairs of shades that are legible on a
        light ground and on a dark one. Every tint declares the same three
        variables and every component that paints one reads only those, which is
        the rule the item asked for: pick the palette once, in one place, and do
        not let each component invent a shade.

        `--tint-fill` is deliberately weak. A sticky note has to be readable
        prose first and a colour second, so the colour is a wash and a border
        rather than a block of paint with text on it.
      */
      .tint-plain {
        --tint-fill: var(--surface);
        --tint-line: var(--line);
        --tint-ink: var(--ink);
      }
      .tint-amber {
        --tint-fill: #fdf1d6;
        --tint-line: #d9a83a;
        --tint-ink: #4a3708;
      }
      .tint-rose {
        --tint-fill: #fbe3e6;
        --tint-line: #d3717f;
        --tint-ink: #4d1620;
      }
      .tint-violet {
        --tint-fill: #eee6fb;
        --tint-line: #9b74d8;
        --tint-ink: #331a52;
      }
      .tint-blue {
        --tint-fill: #dfeafb;
        --tint-line: #5b8fd6;
        --tint-ink: #12294a;
      }
      .tint-teal {
        --tint-fill: #d9f0ee;
        --tint-line: #3f9d92;
        --tint-ink: #0d3b36;
      }
      .tint-green {
        --tint-fill: #e2f2da;
        --tint-line: #62a24a;
        --tint-ink: #1d3b12;
      }
      .tint-slate {
        --tint-fill: #e6e9ee;
        --tint-line: #7d8794;
        --tint-ink: #232a33;
      }
      @media (prefers-color-scheme: dark) {
        .tint-amber {
          --tint-fill: #3a2f14;
          --tint-line: #b58f34;
          --tint-ink: #f4e4bf;
        }
        .tint-rose {
          --tint-fill: #3c2126;
          --tint-line: #bc6b78;
          --tint-ink: #f6d9dd;
        }
        .tint-violet {
          --tint-fill: #2c2340;
          --tint-line: #9a7ad4;
          --tint-ink: #e6dcf8;
        }
        .tint-blue {
          --tint-fill: #1e2b40;
          --tint-line: #5f8ed0;
          --tint-ink: #d8e5f8;
        }
        .tint-teal {
          --tint-fill: #17332f;
          --tint-line: #479a90;
          --tint-ink: #d3ece8;
        }
        .tint-green {
          --tint-fill: #22331b;
          --tint-line: #66a052;
          --tint-ink: #dcefd3;
        }
        .tint-slate {
          --tint-fill: #262a30;
          --tint-line: #79828f;
          --tint-ink: #dfe3e9;
        }
      }

      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        display: grid;
        /* The inspector is a column that exists only when something is
           selected: `hidden` collapses it and the canvas takes the width back,
           without a second layout to keep in step with the first. */
        grid-template-columns: 1fr auto;
        grid-template-rows: 1fr auto;
        background: var(--page);
        color: var(--ink);
        overflow: hidden;
      }

      .stage {
        position: relative;
        overflow: hidden;
      }
      footer {
        grid-column: 1 / -1;
      }

      #canvas {
        position: absolute;
        inset: 0;
        /* `clip` rather than `hidden`, and it is a correctness fix rather than a
           preference. `hidden` still makes this a scroll container, and the
           scene inside it extends ten thousand pixels either way, so anything
           that scrolls an element into view — the browser focusing a box, or a
           robot clicking one — moves the content under a `scrollLeft` this page
           knows nothing about. ADR 0015 says pan is the transform and nothing
           else; a scrolled host makes that false, and every screen-to-model
           conversion silently wrong by the scroll offset. Measured at 811px on
           Edge while driving this page. `clip` is the same clipping with no
           scroll box to move, so the assumption is true rather than hoped for.
           `hidden` first, so a browser without `clip` still clips. */
        overflow: hidden;
        overflow: clip;
        cursor: grab;
        /* Pointer events only reach us if the browser is not busy scrolling. */
        touch-action: none;
        user-select: none;
      }
      #canvas.panning {
        cursor: grabbing;
      }
      /* Placement is the canvas's one mode, so it says so for as long as it
         lasts, where the developer is looking rather than on the button. */
      #canvas.placing {
        cursor: crosshair;
      }

      .scene {
        position: absolute;
        top: 0;
        left: 0;
        transform-origin: 0 0;
      }

      svg.edges {
        position: absolute;
        left: -10000px;
        top: -10000px;
        pointer-events: none;
      }
      .edge {
        fill: none;
        stroke: var(--edge);
        stroke-width: 1.5;
        pointer-events: stroke;
      }
      .edge.related {
        stroke: var(--accent);
        stroke-width: 2.5;
      }
      /* An end that could not find its column is drawn at the table's name, and
         has to be readable as that rather than as an ordinary arrow. Hover it
         for which end it is and why: a column that is not there and a table
         that did not parse are different facts and a reader acts on each
         differently. */
      .edge.unanchored {
        stroke-dasharray: 5 4;
      }
      marker path {
        fill: var(--edge);
        /* Follows the edge's own stroke where the browser supports it, so a
           highlighted edge does not keep a grey arrowhead. */
        fill: context-stroke;
      }

      /* The third layer, scoped for the reason the other two are. */
      .scene > .boxes {
        position: absolute;
        top: 0;
        left: 0;
      }

      .box {
        position: absolute;
        top: 0;
        left: 0;
        width: 220px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 6px;
        box-shadow: 0 1px 2px rgb(0 0 0 / 12%);
        font-size: 12px;
        line-height: 1.45;
        cursor: grab;
      }
      .box.dragging {
        cursor: grabbing;
        box-shadow: 0 6px 18px rgb(0 0 0 / 22%);
      }
      .box.selected {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px var(--accent);
      }
      .box.broken {
        border-color: var(--bad);
        cursor: not-allowed;
      }
      .box > header {
        font-weight: 600;
        padding: 6px 10px;
        border-bottom: 1px solid var(--line);
        font-family: ui-monospace, monospace;
      }
      .box ul {
        list-style: none;
        margin: 0;
        padding: 4px 0;
      }
      /* Two lines when the column points somewhere, one when it does not. The
         row gap is zero so that a row that does not wrap is exactly the height
         it always was; the column gap is the 10px that separates a name from
         its type. ADR 0055. */
      .box li {
        display: flex;
        flex-wrap: wrap;
        gap: 0 10px;
        justify-content: space-between;
        padding: 1px 10px;
        font-family: ui-monospace, monospace;
      }
      /* `margin-left: auto` is a no-op on the ordinary row, where
         `space-between` has already pushed the type to the right edge. It is
         for the row whose name and type are together too wide for the box: the
         type takes a line of its own and this is what keeps it in the same
         column it is in on every other row, rather than under the name. */
      .box li .type {
        margin-left: auto;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* The whole width of the row, under the name it belongs to, right-aligned
         so that it stays in the same column as the type it continues. A box is
         220px wide and stays 220px wide, because a coordinate in a `layout:`
         was written by somebody dragging boxes of that width past each other,
         so the ref gets a line rather than the box getting the width. It keeps
         the ellipsis and the row keeps its `title`: this is enough room for
         every ref in `examples/shop` and not enough for every ref there could
         be. ADR 0055.

         `ref` is a name the inspector's ref field uses too, so this rule is
         anchored on `.box` and the panel's is anchored on `#inspector`, which
         is what ADR 0037 asks for. Worth knowing while you are here:
         `check:scenes` reads a line at a time and the panel's is a call spread
         over five, so it currently reports this pair as unshared. Both rules
         are anchored either way; the check was run against a one-line copy of
         that call to make sure. */
      .box li .ref {
        flex: 0 0 100%;
        text-align: right;
        color: var(--accent);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .box li.pk .name::after {
        content: ' PK';
        color: var(--key);
        font-size: 10px;
      }
      .box li.fk .type {
        color: var(--accent);
      }
      .box .problem {
        margin: 0;
        padding: 6px 10px;
        color: var(--bad);
      }

      /* ------------------------------------------------------------------
         Notes and groups (ADR 0005). Both are inside `.scene`, so both are
         positioned in model coordinates and neither knows about the zoom.

         Written as a child of `.scene` rather than as the bare class, and it
         is a fix rather than a flourish. The inspector's red validation
         paragraph is a `p.notes`, so an unscoped `.notes` absolutely
         positioned every one of them at the top-left corner of the page: the
         create form's "there is already a table called `orders`" was drawn
         behind the toolbar, on the far side of the window from the field it
         was about. That is the same accident the `.note-card` comment below
         describes, one plural along, so the answer is the same one said in
         CSS: a rule about a layer of the scene says so.

         That is now a rule rather than a habit. `npm run check:scenes` fails
         the build when a class name both `canvas.ts` and `inspector.ts` write
         has a rule anchored to neither scene. ADR 0037.
         ------------------------------------------------------------------ */
      .scene > .notes,
      .scene > .groups {
        position: absolute;
        top: 0;
        left: 0;
      }

      /* `note-card` and not `note`, because `#inspector .note` was already the
         panel's explanatory paragraph. Two things called `.note` in one
         stylesheet is one rule silently applying to the other, which is what
         happened here: the panel's sentences became absolutely positioned and
         stacked on top of each other in the corner of the page. Seen while
         driving it, which is the only way it would have been seen. */
      .note-card {
        position: absolute;
        top: 0;
        left: 0;
        box-sizing: border-box;
        overflow: hidden;
        background: var(--tint-fill);
        color: var(--tint-ink);
        border: 1px solid var(--tint-line);
        border-radius: 4px;
        box-shadow: 0 2px 6px rgb(0 0 0 / 16%);
        font-size: 12px;
        line-height: 1.5;
        padding: 8px 10px;
        cursor: grab;
      }
      .note-card.dragging {
        cursor: grabbing;
        box-shadow: 0 8px 22px rgb(0 0 0 / 26%);
      }
      .note-card.selected {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      .note-card.broken {
        border-color: var(--bad);
        cursor: not-allowed;
      }
      .note-body {
        /* The note's own size is a design choice (ADR 0005), so a note with
           more prose than it has room for scrolls rather than growing: the
           picture must not change size behind the developer's back. */
        max-height: 100%;
        overflow: auto;
      }
      .note-body > :first-child {
        margin-top: 0;
      }
      .note-body > :last-child {
        margin-bottom: 0;
      }
      .note-body p,
      .note-body ul,
      .note-body pre {
        margin: 0 0 0.6em;
      }
      .note-body h3,
      .note-body h4,
      .note-body h5,
      .note-body h6 {
        margin: 0 0 0.35em;
        font-size: 13px;
      }
      .note-body ul {
        padding-left: 1.1em;
      }
      .note-body code,
      .note-body pre {
        font-family: ui-monospace, monospace;
        font-size: 11px;
      }
      .note-body pre {
        white-space: pre-wrap;
      }
      .note-placeholder {
        opacity: 0.7;
        font-style: italic;
      }
      /* The corner that writes `w` and `h`. Only a note has one: a table's size
         is a consequence of its columns. */
      .note-grip {
        position: absolute;
        right: 0;
        bottom: 0;
        width: 14px;
        height: 14px;
        cursor: nwse-resize;
        background: linear-gradient(
          135deg,
          transparent 0 45%,
          var(--tint-line) 45% 55%,
          transparent 55% 70%,
          var(--tint-line) 70% 80%,
          transparent 80%
        );
      }

      .group {
        position: absolute;
        top: 0;
        left: 0;
        box-sizing: border-box;
        /* The box itself must never eat a press: a click inside a group is a
           click on whatever is in it, or a pan. Only the header is a handle. */
        pointer-events: none;
      }
      .group > header {
        pointer-events: auto;
        display: inline-block;
        max-width: 100%;
        box-sizing: border-box;
        height: 26px;
        line-height: 18px;
        padding: 3px 10px;
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        background: var(--tint-fill);
        color: var(--tint-ink);
        border: 1px solid var(--tint-line);
        border-bottom: 0;
        border-radius: 6px 6px 0 0;
        cursor: grab;
      }
      .group.dragging > header {
        cursor: grabbing;
      }
      .group.selected > header {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }
      /* The count of things the box reaches over that never joined it (ADR
         0035). Hidden whenever there are none, which is most boxes most of the
         time, so a tidy arrangement's label bar looks exactly as it did. */
      .group-covers {
        margin-left: 8px;
        padding-left: 8px;
        border-left: 1px solid color-mix(in srgb, var(--tint-ink) 35%, transparent);
        font-weight: 400;
        font-variant: small-caps;
        letter-spacing: 0.02em;
        opacity: 0.85;
      }
      .group-area {
        position: absolute;
        inset: 26px 0 0 0;
      }
      /* The box is one path with `fill-rule: evenodd` rather than a bordered
         div, so that a non-member's clearing is genuinely absent from the fill.
         A patch of page-colour painted on top would look the same here and
         wrong the moment two group boxes overlap, where it would rub out the
         other group's wash as well as this one's. */
      .group-shape {
        position: absolute;
        inset: 0;
        overflow: visible;
      }
      .group-shape path {
        fill: color-mix(in srgb, var(--tint-fill) 45%, transparent);
        stroke: var(--tint-line);
        stroke-width: 1;
      }
      .group.selected .group-shape path {
        stroke: var(--accent);
      }
      /* An empty group has no members to bound, so it is drawn as a dashed
         placeholder rather than as nothing: a group whose last member left has
         not been deleted, and a blank space would say it had. */
      .group.empty .group-shape path {
        fill: none;
        stroke-dasharray: 6 4;
      }
      .group-empty {
        margin: 10px;
        font-size: 11px;
        line-height: 1.4;
        color: var(--muted);
      }

      /* --------------------------------------------------------------------
         The focus ring, and why it is not the selected ring.

         An object that can be focused has to look focused, and on this canvas
         focus and selection are two different states that are true at the same
         time: the arrows move focus, `Enter` selects, so between those presses
         a person is standing on a box they have not chosen. One ring for both
         would not say which. So selection keeps the solid accent it has always
         had, and focus is a dashed ring in the text colour, sitting three
         pixels outside it. Dashed against solid is legible without a second
         colour, and `--ink` has contrast on the page, on a white box and on all
         six note tints, because it is what the words on them are written in.

         `:focus-visible` rather than `:focus`, so a click does not draw it.
         Clicking a box already tells you what you clicked.

         **These four declarations are the whole of it, deliberately.** The
         visuals phase is going to choose what this page looks like, and a focus
         style spread across six rules is six places to fight. It is one block
         and it borrows tokens that already exist rather than adding one.

         Written after the `.selected` rules on purpose: `.box:focus-visible`
         and `.box.selected` have the same specificity, so this is the half of
         the pair that has to come second to win where both are true. ADR 0067.
         -------------------------------------------------------------------- */
      .box:focus-visible,
      .note-card:focus-visible,
      .group:focus-visible > header {
        outline: 2px dashed var(--ink);
        outline-offset: 3px;
      }

      /* Said to a screen reader and to nobody else. `hidden` and
         `display: none` would take it out of the accessibility tree as well as
         off the page, which is the opposite of what this is for. */
      .to-be-heard {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }

      .toolbar {
        position: absolute;
        top: 12px;
        left: 12px;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 4px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 6px;
        font-size: 12px;
      }
      .toolbar button {
        font: inherit;
        color: inherit;
        background: transparent;
        border: 0;
        border-radius: 4px;
        padding: 3px 8px;
        cursor: pointer;
      }
      .toolbar button:hover {
        background: var(--page);
      }
      .toolbar button[aria-pressed='true'] {
        background: var(--accent);
        color: var(--surface);
      }
      .toolbar .divider {
        width: 1px;
        align-self: stretch;
        margin: 0 2px;
        background: var(--line);
      }
      #zoom-level {
        min-width: 3.2em;
        text-align: center;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      /* ------------------------------------------------------------------
         The inspector. One column of stacked fields; nothing here is a widget
         and nothing here has a Save button, because ADR 0004 says there is no
         unsaved state to have one for.
         ------------------------------------------------------------------ */
      #inspector {
        width: 22rem;
        overflow-y: auto;
        background: var(--surface);
        border-left: 1px solid var(--line);
        font-size: 12px;
        padding: 10px 12px 40px;
      }
      #inspector header .title {
        margin: 0;
        font-size: 15px;
        font-family: ui-monospace, monospace;
      }
      #inspector header .path {
        color: var(--muted);
        font-family: ui-monospace, monospace;
      }
      #inspector section {
        margin-top: 16px;
      }
      #inspector h3 {
        margin: 0 0 6px;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      #inspector .note {
        margin: 6px 0;
        color: var(--muted);
        line-height: 1.4;
      }
      #inspector .note[data-tone='bad'] {
        color: var(--bad);
      }
      #inspector .key {
        margin: 0 0 8px;
        font-family: ui-monospace, monospace;
      }
      #inspector .key.warn {
        color: var(--muted);
      }
      #inspector input[type='text'],
      #inspector select,
      #inspector textarea {
        font: inherit;
        font-family: ui-monospace, monospace;
        color: inherit;
        background: var(--page);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 3px 6px;
        min-width: 0;
      }
      #inspector textarea {
        width: 100%;
        box-sizing: border-box;
        resize: vertical;
        line-height: 1.5;
        white-space: pre;
        overflow-wrap: normal;
        overflow-x: auto;
      }
      #inspector button {
        font: inherit;
        color: inherit;
        background: var(--page);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 3px 8px;
        cursor: pointer;
      }
      #inspector button:hover {
        border-color: var(--accent);
      }
      #inspector button.danger {
        color: var(--bad);
      }
      #inspector button.primary {
        border-color: var(--accent);
        color: var(--accent);
      }
      #inspector .field {
        display: flex;
        gap: 6px;
      }
      #inspector .field input {
        flex: 1;
      }
      #inspector ol {
        list-style: none;
        margin: 0 0 8px;
        padding: 0;
      }
      #inspector ol > li {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
        padding: 6px;
        margin-bottom: 6px;
        border: 1px solid var(--line);
        border-radius: 5px;
      }
      #inspector ol > li input[type='text'],
      #inspector ol > li select {
        width: 100%;
        box-sizing: border-box;
      }
      #inspector ol > li .ref,
      #inspector ol > li .actions,
      #inspector ol > li .notes,
      #inspector ol > li .confirm-host {
        grid-column: 1 / -1;
      }
      #inspector .flags {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      /* The referential actions are hidden until the column has a ref for them
         to be about, and `display: flex` above beats the browser's own
         `[hidden] { display: none }`, so hiding one needs saying here. Found by
         driving the studio: the panel showed two selects on every column. */
      #inspector ol > li .actions[hidden] {
        display: none;
      }
      #inspector .flag {
        white-space: nowrap;
      }
      #inspector .row-buttons {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 4px;
      }
      #inspector button.icon {
        padding: 1px 6px;
        line-height: 1.3;
      }
      #inspector .notes {
        margin: 2px 0 0;
        color: var(--bad);
        line-height: 1.4;
      }
      #inspector .confirm {
        margin-top: 8px;
        padding: 8px;
        border: 1px solid var(--bad);
        border-radius: 5px;
      }
      #inspector .confirm p {
        margin: 0 0 6px;
        line-height: 1.4;
      }
      #inspector .confirm .row-buttons {
        justify-content: flex-start;
      }
      /* The colour picker. Swatches rather than a list of words, because the
         thing being chosen is one of seven shades and a word cannot show a
         shade. What is written to the file is still the name. */
      #inspector .swatches {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      #inspector button.swatch {
        width: 22px;
        height: 22px;
        padding: 0;
        border-radius: 4px;
        background: var(--tint-fill);
        border: 1px solid var(--tint-line);
      }
      #inspector button.swatch.none {
        background: var(--page);
        border-style: dashed;
      }
      #inspector button.swatch[aria-pressed='true'] {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      #inspector ul.members {
        list-style: none;
        margin: 0 0 6px;
        padding: 0;
        font-family: ui-monospace, monospace;
      }

      footer {
        border-top: 1px solid var(--line);
        background: var(--surface);
        padding: 6px 12px;
        font-size: 12px;
      }
      .line {
        display: flex;
        gap: 1rem;
        justify-content: space-between;
      }
      #status-text[data-tone='bad'] {
        color: var(--bad);
      }
      #selection {
        color: var(--muted);
      }
      #diagnostics {
        list-style: none;
        margin: 0 0 6px;
        padding: 0;
        max-height: 6rem;
        overflow: auto;
      }
      #diagnostics li.error {
        color: var(--bad);
      }
      #diagnostics li.warning {
        color: var(--muted);
      }
      #diagnostics code {
        font-family: ui-monospace, monospace;
      }
      /* An edit this session dropped rather than write over a change on disk.
         Above the diagnostics and boxed, because it is the one thing in the
         footer that says something did not happen, and it stands until the
         developer makes the edit again (ADR 0019). */
      #conflicts {
        list-style: none;
        margin: 0 0 6px;
        padding: 6px 8px;
        max-height: 6rem;
        overflow: auto;
        border: 1px solid var(--bad);
        border-radius: 5px;
        color: var(--bad);
        line-height: 1.4;
      }
      #conflicts code {
        font-family: ui-monospace, monospace;
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <!-- `role="group"` for the same reason a group box on the canvas needs
           one (ADR 0065): an unroled `div` is a `generic`, and a `generic`
           cannot carry a name or a description at all. With a role it can, and
           what it carries is the one sentence saying that the arrow keys do
           something, which is otherwise discoverable only by guessing. It is a
           description rather than part of the name so that it is offered on the
           way in and not repeated on every object inside. ADR 0067. -->
      <div id="canvas" role="group" aria-label="Canvas" aria-describedby="canvas-keys"></div>
      <p id="canvas-keys" class="to-be-heard">
        Tab reaches one object on the canvas. Arrow keys move between objects,
        Home and End go to the first and the last, and Enter opens the panel for
        the one you are on.
      </p>
      <div class="toolbar">
        <button id="zoom-out" type="button" aria-label="Zoom out">&minus;</button>
        <span id="zoom-level">100%</span>
        <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
        <button id="zoom-reset" type="button">100%</button>
        <button id="zoom-fit" type="button">Fit</button>
        <span class="divider"></span>
        <!-- Pressed while the next click on the canvas is a placement, which is
             a mode, and a mode has to be legible from outside itself. -->
        <button id="add-table" type="button" aria-pressed="false">Add table</button>
        <button id="add-note" type="button" aria-pressed="false">Add note</button>
        <!-- Deliberately not a placement and deliberately not pressed: a group
             has no coordinates to point at, so there is no mode to be in. -->
        <button id="add-group" type="button">Add group</button>
      </div>
    </main>
    <aside id="inspector" hidden></aside>
    <footer>
      <ul
        id="conflicts"
        hidden
        aria-label="Edits dropped rather than written over the file on disk"
      ></ul>
      <ul id="diagnostics" hidden></ul>
      <p class="line">
        <span id="status-text">Loading the model.</span>
        <!-- Selecting a box changes its border, and a border is not something
             everybody gets. This sentence was already written here on every
             selection; `role="status"` is what makes it spoken, and it is the
             only thing on the page that says what is selected. `Canvas.select`
             returns early when the selection has not actually changed, so it is
             one announcement per selection and not one per press. Its neighbour
             is deliberately not a live region: `showStatus` rewrites that on
             every heartbeat poll, and a write in progress polls until it
             finishes. ADR 0065. -->
        <span id="selection" role="status"></span>
      </p>
    </footer>
    <script type="module" src="./main.js"></script>
  </body>
</html>
