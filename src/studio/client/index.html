<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dbmd studio</title>
    <link rel="icon" href="data:," />
    <style>
      /*
        One palette, in one place, because a colour invented per component is a
        colour that is legible in one theme and not the other. ADR 0005 asks for
        this once notes and groups arrive; it is cheaper to start here.
      */
      :root {
        color-scheme: light dark;
        --page: #f6f6f4;
        --surface: #ffffff;
        --ink: #17181a;
        --muted: #6a6d73;
        --line: #d6d8dc;
        --accent: #2f6fd0;
        --edge: #8a8f98;
        --key: #b07d00;
        --bad: #b3261e;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page: #17181a;
          --surface: #212328;
          --ink: #e8e9ec;
          --muted: #9aa0a8;
          --line: #383b42;
          --accent: #74a7f5;
          --edge: #7c828c;
          --key: #e0b64a;
          --bad: #f2857c;
        }
      }

      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        display: grid;
        /* The inspector is a column that exists only when something is
           selected: `hidden` collapses it and the canvas takes the width back,
           without a second layout to keep in step with the first. */
        grid-template-columns: 1fr auto;
        grid-template-rows: 1fr auto;
        background: var(--page);
        color: var(--ink);
        overflow: hidden;
      }

      .stage {
        position: relative;
        overflow: hidden;
      }
      footer {
        grid-column: 1 / -1;
      }

      #canvas {
        position: absolute;
        inset: 0;
        /* `clip` rather than `hidden`, and it is a correctness fix rather than a
           preference. `hidden` still makes this a scroll container, and the
           scene inside it extends ten thousand pixels either way, so anything
           that scrolls an element into view — the browser focusing a box, or a
           robot clicking one — moves the content under a `scrollLeft` this page
           knows nothing about. ADR 0015 says pan is the transform and nothing
           else; a scrolled host makes that false, and every screen-to-model
           conversion silently wrong by the scroll offset. Measured at 811px on
           Edge while driving this page. `clip` is the same clipping with no
           scroll box to move, so the assumption is true rather than hoped for.
           `hidden` first, so a browser without `clip` still clips. */
        overflow: hidden;
        overflow: clip;
        cursor: grab;
        /* Pointer events only reach us if the browser is not busy scrolling. */
        touch-action: none;
        user-select: none;
      }
      #canvas.panning {
        cursor: grabbing;
      }
      /* Placement is the canvas's one mode, so it says so for as long as it
         lasts, where the developer is looking rather than on the button. */
      #canvas.placing {
        cursor: crosshair;
      }

      .scene {
        position: absolute;
        top: 0;
        left: 0;
        transform-origin: 0 0;
      }

      svg.edges {
        position: absolute;
        left: -10000px;
        top: -10000px;
        pointer-events: none;
      }
      .edge {
        fill: none;
        stroke: var(--edge);
        stroke-width: 1.5;
        pointer-events: stroke;
      }
      .edge.related {
        stroke: var(--accent);
        stroke-width: 2.5;
      }
      /* An end that could not find its column is drawn at the table's name, and
         has to be readable as that rather than as an ordinary arrow. Hover it
         for which column is missing. */
      .edge.unanchored {
        stroke-dasharray: 5 4;
      }
      marker path {
        fill: var(--edge);
        /* Follows the edge's own stroke where the browser supports it, so a
           highlighted edge does not keep a grey arrowhead. */
        fill: context-stroke;
      }

      .boxes {
        position: absolute;
        top: 0;
        left: 0;
      }

      .box {
        position: absolute;
        top: 0;
        left: 0;
        width: 220px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 6px;
        box-shadow: 0 1px 2px rgb(0 0 0 / 12%);
        font-size: 12px;
        line-height: 1.45;
        cursor: grab;
      }
      .box.dragging {
        cursor: grabbing;
        box-shadow: 0 6px 18px rgb(0 0 0 / 22%);
      }
      .box.selected {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px var(--accent);
      }
      .box.broken {
        border-color: var(--bad);
        cursor: not-allowed;
      }
      .box > header {
        font-weight: 600;
        padding: 6px 10px;
        border-bottom: 1px solid var(--line);
        font-family: ui-monospace, monospace;
      }
      .box ul {
        list-style: none;
        margin: 0;
        padding: 4px 0;
      }
      .box li {
        display: flex;
        gap: 10px;
        justify-content: space-between;
        padding: 1px 10px;
        font-family: ui-monospace, monospace;
      }
      .box li .type {
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .box li.pk .name::after {
        content: ' PK';
        color: var(--key);
        font-size: 10px;
      }
      .box li.fk .type {
        color: var(--accent);
      }
      .box .problem {
        margin: 0;
        padding: 6px 10px;
        color: var(--bad);
      }

      .toolbar {
        position: absolute;
        top: 12px;
        left: 12px;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 4px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 6px;
        font-size: 12px;
      }
      .toolbar button {
        font: inherit;
        color: inherit;
        background: transparent;
        border: 0;
        border-radius: 4px;
        padding: 3px 8px;
        cursor: pointer;
      }
      .toolbar button:hover {
        background: var(--page);
      }
      .toolbar button[aria-pressed='true'] {
        background: var(--accent);
        color: var(--surface);
      }
      .toolbar .divider {
        width: 1px;
        align-self: stretch;
        margin: 0 2px;
        background: var(--line);
      }
      #zoom-level {
        min-width: 3.2em;
        text-align: center;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      /* ------------------------------------------------------------------
         The inspector. One column of stacked fields; nothing here is a widget
         and nothing here has a Save button, because ADR 0004 says there is no
         unsaved state to have one for.
         ------------------------------------------------------------------ */
      #inspector {
        width: 22rem;
        overflow-y: auto;
        background: var(--surface);
        border-left: 1px solid var(--line);
        font-size: 12px;
        padding: 10px 12px 40px;
      }
      #inspector header .title {
        margin: 0;
        font-size: 15px;
        font-family: ui-monospace, monospace;
      }
      #inspector header .path {
        color: var(--muted);
        font-family: ui-monospace, monospace;
      }
      #inspector section {
        margin-top: 16px;
      }
      #inspector h3 {
        margin: 0 0 6px;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      #inspector .note {
        margin: 6px 0;
        color: var(--muted);
        line-height: 1.4;
      }
      #inspector .note[data-tone='bad'] {
        color: var(--bad);
      }
      #inspector .key {
        margin: 0 0 8px;
        font-family: ui-monospace, monospace;
      }
      #inspector .key.warn {
        color: var(--muted);
      }
      #inspector input[type='text'],
      #inspector select,
      #inspector textarea {
        font: inherit;
        font-family: ui-monospace, monospace;
        color: inherit;
        background: var(--page);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 3px 6px;
        min-width: 0;
      }
      #inspector textarea {
        width: 100%;
        box-sizing: border-box;
        resize: vertical;
        line-height: 1.5;
        white-space: pre;
        overflow-wrap: normal;
        overflow-x: auto;
      }
      #inspector button {
        font: inherit;
        color: inherit;
        background: var(--page);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 3px 8px;
        cursor: pointer;
      }
      #inspector button:hover {
        border-color: var(--accent);
      }
      #inspector button.danger {
        color: var(--bad);
      }
      #inspector button.primary {
        border-color: var(--accent);
        color: var(--accent);
      }
      #inspector .field {
        display: flex;
        gap: 6px;
      }
      #inspector .field input {
        flex: 1;
      }
      #inspector ol {
        list-style: none;
        margin: 0 0 8px;
        padding: 0;
      }
      #inspector ol > li {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
        padding: 6px;
        margin-bottom: 6px;
        border: 1px solid var(--line);
        border-radius: 5px;
      }
      #inspector ol > li input[type='text'],
      #inspector ol > li select {
        width: 100%;
        box-sizing: border-box;
      }
      #inspector ol > li .ref,
      #inspector ol > li .notes,
      #inspector ol > li .confirm-host {
        grid-column: 1 / -1;
      }
      #inspector .flags {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #inspector .flag {
        white-space: nowrap;
      }
      #inspector .row-buttons {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 4px;
      }
      #inspector button.icon {
        padding: 1px 6px;
        line-height: 1.3;
      }
      #inspector .notes {
        margin: 2px 0 0;
        color: var(--bad);
        line-height: 1.4;
      }
      #inspector .confirm {
        margin-top: 8px;
        padding: 8px;
        border: 1px solid var(--bad);
        border-radius: 5px;
      }
      #inspector .confirm p {
        margin: 0 0 6px;
        line-height: 1.4;
      }
      #inspector .confirm .row-buttons {
        justify-content: flex-start;
      }

      footer {
        border-top: 1px solid var(--line);
        background: var(--surface);
        padding: 6px 12px;
        font-size: 12px;
      }
      .line {
        display: flex;
        gap: 1rem;
        justify-content: space-between;
      }
      #status-text[data-tone='bad'] {
        color: var(--bad);
      }
      #selection {
        color: var(--muted);
      }
      #diagnostics {
        list-style: none;
        margin: 0 0 6px;
        padding: 0;
        max-height: 6rem;
        overflow: auto;
      }
      #diagnostics li.error {
        color: var(--bad);
      }
      #diagnostics li.warning {
        color: var(--muted);
      }
      #diagnostics code {
        font-family: ui-monospace, monospace;
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <div id="canvas"></div>
      <div class="toolbar">
        <button id="zoom-out" type="button" aria-label="Zoom out">&minus;</button>
        <span id="zoom-level">100%</span>
        <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
        <button id="zoom-reset" type="button">100%</button>
        <button id="zoom-fit" type="button">Fit</button>
        <span class="divider"></span>
        <!-- Pressed while the next click on the canvas is a placement, which is
             a mode, and a mode has to be legible from outside itself. -->
        <button id="add-table" type="button" aria-pressed="false">Add table</button>
      </div>
    </main>
    <aside id="inspector" hidden></aside>
    <footer>
      <ul id="diagnostics" hidden></ul>
      <p class="line">
        <span id="status-text">Loading the model.</span>
        <span id="selection"></span>
      </p>
    </footer>
    <script type="module" src="./main.js"></script>
  </body>
</html>
