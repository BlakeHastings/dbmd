# The merge gate. A ruleset on `main` requires a status check named exactly
# `check`, with an empty bypass list, so the name below is not cosmetic: a job
# whose reported name stops being `check` is a required check that never
# reports, which blocks every pull request without failing anything. ADR 0001
# for why this workflow is the layer that decides what lands, ADR 0032 for why
# it now runs twice.
#
# That is the reason for the shape here. `verify` is the matrix and GitHub names
# its runs `verify (22)` and `verify (24)`; `check` is a single job that reports
# under the one name the ruleset knows, and it passes only if every leg of the
# matrix passed. Putting the matrix directly on a job called `check` is the
# change that breaks the gate.
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    strategy:
      # Both legs run to completion. Knowing that a change is broken on 22 and
      # fine on 24 is the whole reason for the matrix, and fail-fast throws away
      # exactly that.
      fail-fast: false
      matrix:
        # The floor `package.json` promises, and the Active LTS this is
        # developed on. Two versions rather than every version: these are the
        # ends of the supported range, and the middle is not where a break
        # appears on its own. ADR 0032.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check

  check:
    name: check
    runs-on: ubuntu-latest
    needs: verify
    # Without this the job is skipped when the matrix fails, and a skipped
    # required check is not the same thing as a failed one. The gate has to
    # report a verdict on every run, so it always runs and reads the result.
    if: always()
    steps:
      - name: every supported Node passed
        run: |
          echo "verify: ${{ needs.verify.result }}"
          test "${{ needs.verify.result }}" = "success"
