# Layer 3 of the enforcement stack: detection, not prevention. It runs only on
# push to the default branch, so it must never be a required check -- a job that
# never runs on a pull request reads as "never ran" and would refuse every merge.
name: provenance

on:
  push:
    branches: [main, dx/53-action-runtimes]

jobs:
  provenance:
    name: provenance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: node scripts/check-main-provenance.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE_BEFORE: 9a5cab125c341273a919b14a1b5b26eb370a6a6e
          PROVENANCE_AFTER: 938cfe435cd0b63904913f48a3c85c7d8724baee
